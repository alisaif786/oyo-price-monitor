spring.application.name=oyo-price-monitor

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/oyodb?options=-c%20TimeZone%3DUTC}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.didl-auto=update
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

telegram.bot.token=${TELEGRAM_BOT_TOKEN}

jwt.secret=mySuperSecretKeyForOyoPriceMonitorApplication123456789