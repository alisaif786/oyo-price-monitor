services:

  postgres:
    image: postgres:18
    container_name: oyo-postgres
    environment:
      POSTGRES_DB: oyodb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d oyodb" ]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    image: oyo-price-monitor:1.0
    container_name: oyo-price-monitor
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/oyodb?options=-c%20TimeZone%3DUTC
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres123
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}

volumes:
  postgres_data: